name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify tag and desktop version
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag: $tag" }
          $version = (Get-Content -LiteralPath "desktop\VERSION" -Raw).Trim()
          if ($tag -ne "v$version") { throw "Tag $tag does not match desktop version v$version" }
          $tagCommit = (git rev-list -n 1 $tag).Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $headCommit) { throw "Checkout $headCommit does not match $tag ($tagCommit)" }
          foreach ($path in @(
            "desktop\AperolSpritz.spec",
            "desktop\build.ps1",
            "desktop\package_release.ps1",
            "desktop\README.release.txt",
            "docs\Руководство оператора.pdf",
            ".github\RELEASE_NOTES.md"
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release input: $path" }
          }

      - name: Refuse to overwrite an existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release already exists; refusing to overwrite it" }
          exit 0

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            desktop/requirements.txt
            desktop/requirements-build.txt

      - name: Install dependencies
        working-directory: desktop
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Compile Python modules
        working-directory: desktop
        run: python -m compileall -q app.py aperolspritz tests

      - name: Run unit tests
        working-directory: desktop
        run: python -m unittest discover -s tests -v

      - name: Build Windows onedir application
        shell: pwsh
        working-directory: desktop
        run: .\build.ps1 -PythonExecutable (Get-Command python).Source -UsePythonEnvironment -SkipInstall -SkipTests

      - name: Verify onedir output
        shell: pwsh
        run: |
          foreach ($path in @(
            "desktop\dist\AperolSpritz\AperolSpritz.exe",
            "desktop\dist\AperolSpritz\_internal",
            "desktop\dist\AperolSpritz\README.txt"
          )) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing onedir output: $path" }
          }

      - name: Smoke test frozen application
        shell: pwsh
        run: .\desktop\scripts\smoke_test_frozen.ps1 -Executable .\desktop\dist\AperolSpritz\AperolSpritz.exe

      - name: Package ZIP and SHA-256
        shell: pwsh
        run: .\desktop\package_release.ps1 -Tag $env:RELEASE_TAG

      - name: Verify PDF inside release archive
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead("desktop\release\AperolSpritz-Windows-x64.zip")
          try {
            $entries = @($zip.Entries)
            $manual = @($entries | Where-Object { $_.FullName.Replace('\', '/') -eq "AperolSpritz/docs/Руководство оператора.pdf" })
            if ($manual.Count -ne 1 -or $manual[0].Length -le 5) { throw "Operator manual PDF is missing or empty" }
            $docx = @($entries | Where-Object { $_.FullName -match '\.docx?$' })
            if ($docx) { throw "DOC/DOCX files are forbidden in the Windows archive" }
          } finally {
            $zip.Dispose()
          }

      - name: Verify release archive checksum
        shell: pwsh
        run: |
          $zip = "desktop\release\AperolSpritz-Windows-x64.zip"
          $checksum = "$zip.sha256"
          $expected = ((Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "SHA-256 verification failed" }

      - name: Publish stable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG `
            "desktop\release\AperolSpritz-Windows-x64.zip" `
            "desktop\release\AperolSpritz-Windows-x64.zip.sha256" `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title "AperolSpritz Desktop $env:RELEASE_TAG" `
            --notes-file ".github\RELEASE_NOTES.md" `
            --latest

      - name: Verify published assets and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json url,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease) { throw "Release is not stable" }
          foreach ($name in @("AperolSpritz-Windows-x64.zip", "AperolSpritz-Windows-x64.zip.sha256")) {
            $assets = @($release.assets | Where-Object { $_.name -eq $name -and [int64]$_.size -gt 0 })
            if ($assets.Count -ne 1) { throw "Missing or duplicate published asset: $name" }
          }
          $download = Join-Path $env:RUNNER_TEMP "published-release"
          New-Item -ItemType Directory -Path $download | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern "AperolSpritz-Windows-x64.zip" --dir $download
          $builtHash = (Get-FileHash -LiteralPath "desktop\release\AperolSpritz-Windows-x64.zip" -Algorithm SHA256).Hash
          $downloadedHash = (Get-FileHash -LiteralPath (Join-Path $download "AperolSpritz-Windows-x64.zip") -Algorithm SHA256).Hash
          if ($builtHash -ne $downloadedHash) { throw "Published ZIP differs from the built ZIP" }
          Write-Output "RELEASE_URL=$($release.url)"
